{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <h1 class="auth-title mb-4">Edit Profile</h1>
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-3 rounded-pill">Save Changes</button>
                </form>
                <a href="{% url 'profile' %}" class="btn btn-outline-secondary w-100 mt-2 rounded-pill">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
