{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}
{% block extra_css %}
<link href="{% static 'css/forms.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <div class="text-center mb-4">
                    <h1 class="auth-title">Welcome Back</h1>
                    <p class="text-muted">Login to your Wild Geese Studios account</p>
                </div>
                <form method="POST" action="{% url 'account_login' %}">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-3 rounded-pill">Login</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Need an account?
                    <a href="{% url 'account_signup' %}" style="color: var(--color-teal);">Sign Up Now</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
